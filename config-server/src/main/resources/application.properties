spring.application.name=config-server
server.port=8888
server.address=127.0.0.1

# Usa o repositório público por padrão; CONFIG_GIT_URI permite substituir a URL.
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/Sayuuryi/repo-configs-trabalho-server.git}
spring.cloud.config.server.git.default-label=${CONFIG_GIT_LABEL:main}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.refresh-rate=0
# O health verifica um arquivo que existe no repositório, no perfil DEV.
spring.cloud.config.server.health.repositories.vendas.name=cliente-vendas
spring.cloud.config.server.health.repositories.vendas.profiles=dev

management.endpoints.web.exposure.include=health,info
