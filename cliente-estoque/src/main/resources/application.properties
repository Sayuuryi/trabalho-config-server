# Identifica qual arquivo o servidor deve fornecer.
spring.application.name=cliente-estoque
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# A configuração é obrigatória: um cliente não deve iniciar com dados ausentes.
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.cloud.config.label=${CONFIG_GIT_LABEL:main}

# Endpoints usados na demonstração; refresh exige requisição POST.
management.endpoints.web.exposure.include=health,info,refresh

# Ambiente de demonstração na própria máquina.
server.address=127.0.0.1
# server.port e mensagem.boasvindas estão exclusivamente no Git de configurações.
